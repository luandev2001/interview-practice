spring:
  datasource:
    username: postgres
    password: 123456
    url: jdbc:postgresql://localhost:5432/test_interview_practice
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time-zone: UTC
          batch_size: 1000
        format_sql: true
        insert_updates: true
        order_updates: true
        generate_statistics: true
  shell:
    interactive:
      enabled: true
logging:
  level:
    org:
      hibernate:
        #        SQL: DEBUG
        #        type.descriptor.sql.BasicBinder: TRACE
        engine.transaction: DEBUG
      #        transaction: DEBUG
sentry:
  dsn: Your-DSN
  environment: development
  traces-sample-rate: 0.2
  debug: true
  send-default-pii: true          # Gửi thông tin nhạy cảm như IP, cookie, header